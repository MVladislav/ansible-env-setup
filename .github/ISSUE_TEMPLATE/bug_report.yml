---
name: Report a bug
description: Report a bug in the playbooks or roles.
body:
  - type: markdown
    attributes:
      value: |
        This issue form is for reporting bugs only!

        If you have a feature or enhancement request, please use the feature request issue template.
  - type: textarea
    id: problem
    validations:
      required: true
    attributes:
      label: Describe the problem
      description: >-
        What you were trying to do and what happened instead. Include the playbook and role(s) involved.
      placeholder: >-
        Running `playbook-s-cis.yml` against a Ubuntu 24.04 host fails at the UFW step with ...
  - type: textarea
    id: expected
    validations:
      required: true
    attributes:
      label: Expected behavior
      description: A clear and concise description of what you expected to happen.
  - type: textarea
    id: reproduce
    attributes:
      label: How to reproduce
      description: >-
        The exact command you ran, all relevant inventory variables and any host/group you targeted. Remove any secrets
        (passwords, ssh keys, hashes).
      placeholder: |
        ansible-playbook playbooks/playbook-...yml --limit <host> -K
        (inventory: inventory/inventory-<device>.yml)
  - type: markdown
    attributes:
      value: |
        ## Environment
  - type: input
    id: ansible_version
    validations:
      required: true
    attributes:
      label: ansible-core version
      placeholder: 2.21.2
      description: Output of `ansible --version`.
  - type: input
    id: ansible_lint_version
    attributes:
      label: ansible-lint version
      placeholder: v26.6.0
      description: If the issue is lint-related.
  - type: input
    id: target_os
    validations:
      required: true
    attributes:
      label: Target operating system
      placeholder: Ubuntu 24.04 (noble)
  - type: dropdown
    id: device_type
    validations:
      required: true
    attributes:
      label: What kind of host is affected?
      description: >
        Which profile the playbook was targeting.
      options:
        - Client device
        - Server instance
        - localhost (this machine)
        - Not sure
  - type: markdown
    attributes:
      value: |
        # Details
  - type: textarea
    id: logs
    attributes:
      label: Debug log
      description: >-
        Re-run with `-vvv` (`ansible-playbook ... -vvv`) and paste the relevant failure section here.
      render: shell
  - type: textarea
    id: additional
    attributes:
      label: Additional information
      description: >
        Any other context. You can attach screenshots or screen recordings here by dragging and dropping files into the field
        below.
